    Publications:
      - title: "Mapping the political landscape from data traces: multidimensional opinions of users, politicians and media outlets on X"
        authors:
          - Antoine Vendeville
          - Jimena Royo-Letelier
          - Duncan Cassells
          - Jean-Philippe Cointet
          - Maxime Crépel
          - Tim Faverjon
          - Théophile Lenoir
          - Béatrice Mazoyer
          - Benjamin Ooghe-Tabanou
          - Armin Pournaki
          - Hiroki Yamashita
          - Pedro Ramaciotti
        publisher: Data in Brief
        releaseDate: 2026-02-21
        url: https://doi.org/10.1016/j.dib.2026.112615
        summary: "Studying political activity on social media often requires defining and measuring political stances of users or content. Relevant examples include the study of opinion polarization, or the study of political diversity in online content diets. While many research designs rely on operationalizations best suited for the US setting, few allow addressing more general political systems, in which users and media outlets might exhibit stances on multiple ideology and issue dimensions, going beyond traditional Liberal-Conservative or Left-Right scales. To advance the study of more general online ecosystems, we present a dataset pertaining to a population of 519 K X/Twitter users, parliamentarians, and media outlets embedded in a political space spanned by dimensions measuring attitudes towards immigration, the EU, liberal values, elites and institutions, nationalism and the environment, in addition to left-right and liberal-conservative scales. We include indicators of individual activity and popularity: mean number of posts per day, number of followers, and number of followees. We provide several benchmarks validating the positions of these entities and discuss several applications for this dataset."

      - title: "The Resting Fields Alliance of Ten Salt-Making Provinces of Japan (1809–1888)"
        authors:
          - Aleksandra Kobiljski
          - Mathieu Fauré
          - Hiroki Yamashita
        publisher: Journal of Open Humanities Data
        releaseDate: 2026-01-23
        url: https://doi.org/10.5334/johd.396
        summary: "The aim of this discussion paper is to describe the dataset entitled The Resting Fields Alliance of Ten Salt-making Provinces of Japan (1809–1888) available via Nakala repository. This dataset, along with the present discussion paper, is designed to support and enhance research work on the shifts in the salt industry between 1809 and 1888. The data were produced with the goal of enabling historical social network analysis (SNA), data visualization and other forms of data exploration, including but not limited to hypothesis testing. This dataset is available under the Open Data Commons Open Database License (ODbL-1.0) to support the replicability of historical analysis in progress and forthcoming in the domain of history of industry and enterprise in 19th-century Japan. The discussion paper provides the research context that enabled data production as well as a description of data harvesting and input protocols used in the course of data production. In line with Open Science principles, including standards of findability, accessibility, interoperability and reusability, the ambition of this discussion paper, as well as the dataset, is to contribute to new standards of reproducibility in the discipline of history and in the field of Asian Studies."

      - title: "Network Analysis of a Maritime Trade in Medieval Japan: Visualizing the 1445 Toll Register of Incoming Ships at the Hyōgo Northern Barrier (present-day Kobe)"
        authors:
          - Dimitri Tatoyan
          - Aleksandra Kobiljski
          - Hiroki Yamashita
          - Eric Mermet
        publisher: Journal of Open Humanities Data
        releaseDate: 2024
        url: https://jhnr.net/articles/10.25517/jhnr.v10i1.86
        summary: "The 1445 Toll Register is the only surviving medieval customs register in Japan. As such, it is a precious window into Japan’s medieval commercial revolution. While well studied using traditional methods, this article is the first attempt to submit this source to social network analysis (SNA) methods. It highlights the potential of statistical, spatial and network analysis, producing visualizations which nuance our understanding of the role of commercial agents in the medieval maritime trade. Starting from visualizing the overall network, this article probes into the legwork of a commodity network, much of which passed through the hands of the commercial agents. Our analysis also reveals that a group of 32 actors, who in the register appear to have been principally commercial agents, were in fact also shipmasters. A community detection method allows us to open up new avenues of understanding maritime trade clusters, while geospatial data visualization point to a historically irregular absence which requires further research."

